[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ecomflow"
version = "0.1.0"
description = "Multi-Channel E-commerce Automation Framework"
requires-python = ">=3.11"
dependencies = ["pandas>=2,<4", "requests>=2.32,<3", "pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl>=3.1,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
ecomflow = "ecomflow.cli:main"
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ecomflow*", "mock_platform*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
